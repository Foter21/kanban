<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3326">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/corp.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Meus quadros | KANBANTS</title>
</head>
<body class="app">
  <aside class="sidebar">
    <a class="side-brand" href="/boards"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></span><span>KANBAN<b>TS</b></span></a>
    <div class="side-label">Navegação</div>
    <a class="side-link" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg> Início</a>
    <a class="side-link active" href="/boards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Meus quadros</a>
    <div class="side-user"><span class="account-avatar" id="avatar"></span><span class="account-email" id="accName"></span><button class="logout-button" id="logout" type="button">Sair</button></div>
  </aside>
  <div class="content">
    <header class="toolbar bp-head">
      <div class="toolbar-title"><div class="kicker">Área de trabalho</div><div class="project-name" id="greeting" style="margin-left:0;padding-left:0">Meus quadros</div><div class="board-subtitle">Crie quadros e acesse os que foram compartilhados com você.</div></div>
      <div class="bp-stats" id="stats" hidden>
        <div class="bp-stat"><b id="stBoards">0</b><span>quadros</span></div>
        <div class="bp-stat"><b id="stTasks">0</b><span>tarefas</span></div>
        <div class="bp-stat"><b id="stShared">0</b><span>compartilhados</span></div>
      </div>
    </header>
    <div class="scroll"><div class="bp-wrap">
      <form class="bp-create" id="newBoardForm">
        <span class="bp-create-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <input id="newBoardName" maxlength="60" placeholder="Dê um nome ao novo quadro, ex.: Lançamento do produto" aria-label="Nome do novo quadro" autocomplete="off">
        <button class="btn btn-primary" type="submit" id="createBtn">Criar quadro</button>
      </form>

      <div class="bp-section"><h2>Meus quadros <small id="mineCount"></small></h2>
        <label class="bp-search" id="searchWrap" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" type="search" placeholder="Buscar quadro" aria-label="Buscar quadro"></label>
      </div>
      <div class="bp-grid" id="mine"></div>

      <div class="bp-section"><h2>Compartilhados comigo <small id="sharedCount"></small></h2></div>
      <div class="bp-grid" id="shared"></div>
    </div></div>
  </div>

  <dialog id="delDialog" aria-labelledby="delTitle">
    <div class="modal-head"><h2 id="delTitle">Excluir quadro?</h2><p id="delText"></p></div>
    <div class="modal-form"><div class="actions"><button class="btn-cancel" type="button" id="delCancel">Cancelar</button><button class="btn-save bp-danger" type="button" id="delOk">Excluir definitivamente</button></div></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/api.js"></script>
  <script src="/static/boards.js"></script>
</body>
</html>
