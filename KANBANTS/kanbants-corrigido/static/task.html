<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3326">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/corp.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Tarefa | KANBANTS</title>
</head>
<body class="app">
  <aside class="sidebar">
    <a class="side-brand" href="/boards"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></span><span>KANBAN<b>TS</b></span></a>
    <div class="side-label">Navegação</div>
    <a class="side-link" href="/boards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Meus quadros</a>
    <div class="side-user"><span class="account-avatar" id="avatar"></span><span class="account-email" id="accName"></span><button class="logout-button" id="logout" type="button">Sair</button></div>
  </aside>
  <div class="content">
    <header class="toolbar">
      <div class="toolbar-title"><div class="kicker">Tarefa no quadro</div><div class="project-name" id="boardName" style="margin-left:0;padding-left:0">Carregando...</div><div class="board-subtitle"><span id="roleBadge" class="role-badge"></span><span id="saveState" class="save-state"></span></div></div>
      <div class="toolbar-actions"><a class="btn btn-outline" id="backLink" href="/boards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Voltar ao quadro</a></div>
    </header>
    <div class="scroll">
      <main class="task-layout" id="layout" hidden>
        <aside>
          <section class="panel">
            <h2>Detalhes</h2>
            <div class="field"><label for="assignee">Responsável</label><select id="assignee"></select></div>
            <div class="field"><label for="due">Prazo</label><input id="due" type="date"></div>
            <div class="field"><label for="priority">Prioridade</label><select id="priority"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option></select></div>
            <div class="field"><label for="column">Coluna</label><select id="column"></select></div>
            <div class="field" style="margin-bottom:0"><label for="labels">Labels (separe por vírgula)</label><input id="labels" placeholder="bug, feature, urgente"></div>
            <button class="btn btn-outline ai-break" id="aiClassify" type="button" title="A IA sugere tag e prioridade a partir do título e da descrição"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Classificar com IA</button>
          </section>
          <section class="panel" style="margin-top:16px">
            <h2>Checklist <span id="checkCount" style="float:right"></span></h2>
            <div class="progress"><i id="progressBar"></i></div>
            <ul class="checklist" id="checklist"></ul>
            <form class="add-line" id="checkForm"><input id="checkText" maxlength="120" placeholder="Nova subtarefa"><button class="btn-save" type="submit">Adicionar</button></form>
            <button class="btn btn-outline ai-break" id="aiBreak" type="button" title="A IA sugere um checklist a partir do título e da descrição"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Quebrar em subtasks</button>
          </section>
        </aside>
        <div>
          <section class="panel">
            <div class="field"><label for="title">Título</label><input id="title" class="task-title-input" maxlength="80"></div>
            <div class="field" style="margin-bottom:0"><label for="desc">Descrição</label><textarea id="desc" placeholder="Detalhes da atividade"></textarea></div>
          </section>
          <section class="panel" style="margin-top:16px">
            <h2>Comentários</h2>
            <div id="comments"></div>
            <form class="comment-form" id="commentForm"><textarea id="commentText" maxlength="1000" placeholder="Escreva um comentário..."></textarea><div class="actions"><button type="submit" class="btn-save">Comentar</button></div></form>
            <div class="note" id="viewerNote" hidden>Leitores podem ver os comentários, mas não podem comentar.</div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/api.js"></script>
  <script src="/static/task.js"></script>
</body>
</html>
